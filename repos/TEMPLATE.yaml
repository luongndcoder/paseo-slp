# Copy to repos/<repo>.yaml, where <repo> = basename of the MAIN repo directory
# (slp-verify derives it from `git rev-parse --path-format=absolute --git-common-dir`, so a
# worktree maps to the repo it was created from). Pass --repo-config PATH to override.
# `--repo-config` must point OUTSIDE the worktree being verified (a Lead could otherwise run
# arbitrary commands by writing a config under .slp/ and pointing slp-verify at it).
# Configs are reviewed by humans; never generated by agents.

repo: example-repo          # must equal the repo directory name (checked for repos/<repo>.yaml)

# Commands run from the worktree root with `sh -c`. A missing command => check status
# `unconfigured` and the overall verdict can never be `pass`. To skip on purpose, say why:
#   typecheck: {skip: "pure Python repo without type hints"}
# `{tests}` in cmd is replaced by the brief's tests_must_pass (shell-quoted, space separated);
# without the placeholder the command runs as written.
commands:
  test:
    cmd: "python -m pytest -q {tests}"
    timeout: 900            # seconds, per command
  lint:
    cmd: "ruff check ."
    timeout: 300
  typecheck:
    skip: "no typechecker configured in this repo"

# Extra hard-gate rules, appended to repos/_default.yaml (same shape, see that file).
hard_gate_rules:
  - id: example_extra
    description: example repo-specific gate - delete or edit
    paths:
      - '(^|/)config/prod[^/]*\.ya?ml$'
    lines:
      - {sides: [added, removed], re: '\bFEATURE_FLAG_[A-Z_]+\b'}

# Extra sandbox-escape surface, appended to the defaults.
sandbox_escape:
  paths:
    - '(^|/)scripts/release\.sh$'
  structured: []
