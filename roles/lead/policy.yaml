role: lead
family: claude
provider_id: slp-lead
label: "SLP Lead"
description: "SLP workstream lead: full write/bash/git (push/merge any branch, owner decision 2026-11-18), dispatches via Paseo"
write: all
bash: all-except
bash_allow: []
bash_deny: []
protected_branches: []   # 2026-11-18 owner decision: push/merge any branch, any repo
# WHY: global ~/.claude git-flow-guard hard-blocks commit/merge on master; soft = advisory, SLP agents only (2026-11-18)
env: {MOBIO_GITFLOW_GUARD_MODE: soft, MOBIO_ALLOW_FORCE_PUSH: "1"}   # force-push escape in global forbidden-actions/destructive-guard
protected_merge:     # slp-merge only; raw git merge/rebase/pull/push into protected branches stays blocked by slp-guard
  branches: [test, master, develop]
  # roots: ["<dir>"]  # optional: if non-empty the repo (main checkout = parent of git common dir) must be under one; absent = every repo
  deny_roots: []      # wins over roots
  push: true          # slp-merge --push may push the source branch and the target (never forced)
paseo_tools:   # 2026-11-18 owner decision: every Paseo MCP tool enabled
  enabled: true
  disabled: []
# WHY: the Paseo MCP tools create_agent/update_agent/set_agent_mode are otherwise unrestricted (any provider, any
# agent). slp-build wires a PreToolUse hook (mcp__paseo__create_agent|update_agent|set_agent_mode) into slp-guard:
# create_agent is allowed only when the provider part of `provider[/model]` is listed here; update_agent and
# set_agent_mode are always blocked. Every id must be a provider_id of a role (slp-build checks).
spawn_allow: [antigravity, slp-opencode-builder, slp-claude-builder, slp-pi-builder, slp-claude-checker, slp-opencode-checker, slp-claude-final-reviewer, slp-claude-advisor]
skills_auto: [paseo, be-git, be-troubleshoot, slp-lead]
deny_tools: []
probe: {model: claude-haiku-5-5, mode: bypassPermissions, spawn: {allowed: "slp-claude-checker/claude-haiku-5-5"}, profile: slp-lead}
