role: opencode-checker
family: opencode
provider_id: slp-opencode-checker
label: "SLP OpenCode Checker"
description: "SLP peer checker (OpenCode agent slp-checker): cannot write files, bash fully open (2026-11-18), replies with ONE review JSON, task denied, steps capped"
agent_name: slp-checker     # select with profile modeId = slp-checker (never --agent)
steps: 40
write: none          # edit denied: the Lead saves the reply to .slp/slices/<id>/review.<N>.json
bash: all-except     # 2026-11-18 owner decision: commands fully open
bash_allow: []
bash_deny: []
protected_branches: []
# WHY: global ~/.claude git-flow-guard hard-blocks commit/merge on master; soft = advisory, SLP agents only (2026-11-18)
env: {MOBIO_GITFLOW_GUARD_MODE: soft, MOBIO_ALLOW_FORCE_PUSH: "1"}   # force-push escape in global forbidden-actions/destructive-guard
paseo_tools: {enabled: false, disabled: []}
skills_auto: []
deny_tools: [task]
# profile slp-checker-deepseek is added by the user to daemon.agentProfiles (provider slp-opencode-checker,
# model opencode-go/deepseek-v4.1-flash, modeId slp-checker); probe.model/mode are the --cheap fallback.
probe: {model: "opencode-go/deepseek-v4.1-flash", mode: slp-checker, profile: slp-checker-deepseek}
# WHY: slp-* provider entries are replaced wholesale by slp-build --apply; the model list is user-set, so it lives here.
models:
  - {id: "opencode-go/deepseek-v4.1-flash", label: "DeepSeek V4.1 Flash (Go) — checker", isDefault: true}
