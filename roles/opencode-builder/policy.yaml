role: opencode-builder
family: opencode
provider_id: slp-opencode-builder
label: "SLP OpenCode Builder"
description: "SLP peer builder (OpenCode agent slp-builder): edit + bash allowed incl. git push (owner decision 2026-11-18), task denied, steps capped"
agent_name: slp-builder     # select with profile modeId = slp-builder (never --agent)
steps: 80
write: all
bash: all-except
bash_allow: []
bash_deny: []
protected_branches: []   # 2026-11-18 owner decision: push/merge any branch, any repo
# WHY: global ~/.claude git-flow-guard hard-blocks commit/merge on master; soft = advisory, SLP agents only (2026-11-18)
env: {MOBIO_GITFLOW_GUARD_MODE: soft, MOBIO_ALLOW_FORCE_PUSH: "1"}   # force-push escape in global forbidden-actions/destructive-guard
paseo_tools: {enabled: false, disabled: []}
skills_auto: []
deny_tools: [task]
probe: {model: "opencode-go/deepseek-v4.1-flash", mode: slp-builder, git_push: true, skip_reason: "opencode quota exhausted", profile: slp-builder-deepseek}
# WHY: slp-* provider entries are replaced wholesale by slp-build --apply; the model list is user-set, so it lives here.
models:
  - {id: "opencode-go/deepseek-v4.1-flash", label: "DeepSeek V4.1 Flash (Go) — FE + BE", isDefault: true}
