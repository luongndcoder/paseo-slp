role: supervisor
family: claude
provider_id: slp-supervisor
label: "SLP Supervisor"
description: "SLP supervisor (scope, acceptance, escalation owner): discovery + workstreams, no write, allowlisted read-only bash, orchestration-only Paseo tools"
write: none          # none | slp-only | all
bash: allowlist      # none | allowlist | readonly | all-except
bash_allow:          # same as the Lead minus `git merge` (the supervisor never integrates)
  - '^slp-(verify|evidence)(\s|$)'
  - '^git (status|diff|log|show|rev-parse)(\s|$)'
  - '^git branch(\s|$)'
  - '^git worktree list(\s|$)'
bash_deny:
  - '\s--output(=|\s|$)'
  - '^git branch\b.*\s(-d|-D|--delete|-m|-M|--move|-c|-C|--copy|-f|--force)(\s|$)'
protected_branches: [test, master, develop]
paseo_tools:
  enabled: true
  disabled:
    - create_terminal
    - kill_terminal
    - capture_terminal
    - send_terminal_keys
    - list_terminals
    - start_workspace_script
    - stop_workspace_script
    - create_schedule
    - create_heartbeat
    - delete_heartbeat
    - update_schedule
    - delete_schedule
    - pause_schedule
    - resume_schedule
    - run_schedule_once
    - respond_to_permission
    - kill_agent
    - "browser_*"   # expanded by slp-build to every browser_* tool
# WHY: the Paseo MCP tools create_agent/update_agent/set_agent_mode are otherwise unrestricted (any provider, any
# agent). slp-build wires a PreToolUse hook (mcp__paseo__create_agent|update_agent|set_agent_mode) into slp-guard:
# create_agent is allowed only when the provider part of `provider[/model]` is listed here; update_agent and
# set_agent_mode are always blocked. Every id must be a provider_id of a role (slp-build checks).
spawn_allow: [slp-lead, slp-claude-integration-reviewer, slp-claude-advisor]
skills_auto: [paseo, be-research, slp-supervisor]
deny_tools: []       # whole-tool denies in addition to those implied by write/bash
probe: {model: claude-haiku-5-5, mode: bypassPermissions, spawn: {allowed: "slp-claude-advisor/claude-haiku-5-5", denied: "slp-codex-advisor/claude-haiku-5-5"}, profile: slp-supervisor}
