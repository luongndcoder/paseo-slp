role: claude-advisor
family: claude
provider_id: slp-claude-advisor
label: "SLP Claude Advisor"
description: "SLP peer advisor (Claude): second opinion on a design decision; read-only, bash read-only, no Paseo tools, plain-text answer"
write: none          # permissions.deny Edit/Write/MultiEdit/NotebookEdit; the advisor answers in chat only
bash: readonly
bash_allow:
  - '^git (diff|log|show|status|rev-parse)(\s|$)'
  - '^(cat|ls|rg|grep)(\s|$)'
bash_deny:
  - '\s--output(=|\s|$)'
  - '\s--pre(-glob)?(=|\s|$)'
  - '\s--(ext-diff|textconv)(\s|$)'
protected_branches: []
paseo_tools: {enabled: false, disabled: []}
skills_auto: []
# WHY: peers are workers; AskUserQuestion / ExitPlanMode would open a user prompt nobody answers (deny holds under bypassPermissions)
deny_tools: [Agent, Task, NotebookEdit, AskUserQuestion, ExitPlanMode]
# model/thinking: used by `slp-conformance --cheap` when daemon.agentProfiles has no slp-advisor-sonnet yet
probe: {model: claude-sonnet-5-5, mode: bypassPermissions, thinking: high, tools_probe: true, profile: slp-advisor-sonnet}
