role: pi-builder
family: pi
provider_id: slp-pi-builder
label: "SLP Pi Builder"
description: "SLP peer builder (Pi): role prompt via --append-system-prompt; no Paseo tools; Pi has no native permission layer (slp-verify is the net)"
write: all
bash: all
bash_allow: []
bash_deny: []
protected_branches: []   # 2026-11-18 owner decision: push/merge any branch, any repo
# WHY: global ~/.claude git-flow-guard hard-blocks commit/merge on master; soft = advisory, SLP agents only (2026-11-18)
env: {MOBIO_GITFLOW_GUARD_MODE: soft, MOBIO_ALLOW_FORCE_PUSH: "1"}   # force-push escape in global forbidden-actions/destructive-guard
# WHY: Pi has no permission layer, but `--exclude-tools` (name/glob denylist, applies to MCP tools too) removes the
# tools that contradict the role: sub-agents (pi-subagents: subagent, subagents_enable, subagent_supervisor,
# contact_supervisor, bg_wait), ask_user_question (rpiv), donsetch web tools, memongo_* (memory; can ship raw text out).
# Kept: read/bash/edit/write (+ todo) and every MCP tool (Paseo's adapter). Names verified with a throw-away probe
# extension dumping pi.getAllTools() (pi 1.3.0); re-run `slp-conformance --roles pi-builder` after pi package updates.
pi_exclude_tools: [subagent*, contact_supervisor, bg_wait, ask_user_question, "web_*", "memongo_*"]
paseo_tools: {enabled: false, disabled: []}
skills_auto: []
deny_tools: []
probe: {model: "openai-api/gemini-3.8-flash-high", mode: null, git_push: true, tools_probe: true, profile: slp-builder-pi-flash}
