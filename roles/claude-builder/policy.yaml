role: claude-builder
family: claude
provider_id: slp-claude-builder
label: "SLP Claude Builder"
description: "SLP peer builder (Claude): writes code inside its slice; full bash/git incl. push (owner decision 2026-11-18), no sub-agents, no Paseo tools"
write: all
bash: all-except
bash_allow: []
bash_deny: []
protected_branches: []   # 2026-11-18 owner decision: push/merge any branch, any repo
# WHY: global ~/.claude git-flow-guard hard-blocks commit/merge on master; soft = advisory, SLP agents only (2026-11-18)
env: {MOBIO_GITFLOW_GUARD_MODE: soft, MOBIO_ALLOW_FORCE_PUSH: "1"}   # force-push escape in global forbidden-actions/destructive-guard
paseo_tools: {enabled: false, disabled: []}
skills_auto: [be-git, be-api-docs-sync]
# WHY: peers are workers; AskUserQuestion / ExitPlanMode would open a user prompt nobody answers (deny holds under bypassPermissions)
deny_tools: [Agent, Task, NotebookEdit, AskUserQuestion, ExitPlanMode]
probe: {model: claude-haiku-5-5, mode: bypassPermissions, git_push: true, tools_probe: true, profile: slp-builder-sonnet}
